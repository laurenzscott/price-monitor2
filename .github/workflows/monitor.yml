name: Price monitor

on:
  schedule:
    # Once a day at 05:04 UTC. GitHub runs cron in UTC and ignores summer
    # time, so this is 06:04 in Germany in winter and 07:04 in summer.
    - cron: "4 5 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the snapshot back

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the monitor
        id: monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Save the new snapshot
        # Runs even when the monitor exited non-zero, so a failed run still
        # leaves the history intact.
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nothing changed in data/ — no commit"
            exit 0
          fi
          git config user.name  "price-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "monitor: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
